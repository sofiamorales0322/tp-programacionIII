<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscribirse a una actividad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
    <header>
        <h1>Deportes UNCa</h1>
        <div class="container">
            <nav class="navbar navbar-expand-sm navbar-celeste fixed-top">
                <div class="container-fluid">
                    <a class="navbar-brand" href="#">
                        <img src="../img/unca-logo.jpg" width="95" height="30">
                    </a>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#collapsibleNavbar">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="collapsibleNavbar">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <a class="nav-link" href="pagina1.html">Inicio</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="#">Registrarse</a>
                            </li>
                            <li  class="nav-item">
                                <a class="nav-link" href="#">Iniciar sesión</a>
                            </li>
                            <li  class="nav-item">
                                <a class="nav-link" href="#">Actividades deportivas</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link  active" href="pagina2.html">Inscribirse a una actividad</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="pagina3.html">Mis inscripciones</a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link" href="pagina3.html">Cancelar suscripcion</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </div>
    </header>

    <main class="container mt-4">
        <h2>Inscribirse a una actividad</h2>

        <form action="pagina3.html" onsubmit="return validarFormulario()" method="post">
            <fieldset class="border p-3 rounded mb-3">
                <legend>Información de la Actividad</legend>
                <div class="mb-3 mt-3">
                    <label for="actividad" class="form-label">Actividad:</label>
                    <input type="text" class="form-control" id="actividad" name="actividad" value="Futbol" disabled>
                </div>
                <div class="mb-3">
                    <label for="lugar" class="form-label">Lugar:</label>
                    <input type="text" class="form-control" id="lugar" name="lugar" value="Cancha general" disabled>
                </div>
                <div class="mb-3">
                    <label for="dia" class="form-label">Dia:</label>
                    <input type="text" class="form-control" id="dia" name="dia" value="miercoles y viernes" disabled>
                </div>
                <div class="mb-3">
                    <label for="horario" class="form-label">Horario:</label>
                    <input type="text" class="form-control" id="horario" name="horario" value="19:00 - 21:00" disabled>
                </div>
            </fieldset>

            <fieldset class="border p-3 rounded mb-3">
                <legend>Datos del participante</legend>
                <div class="mb-3">
                    <label for="cantidadParticipantes" class="form-label">Cantidad de participantes</label>
                    <input type="number" id="cantidadParticipantes" min="1" max="10" class="form-control">
                </div>
                <div class="mb-3">
                    <button type="button" id="btnParticipantes" class="btn btn-secondary">Generar participantes</button>
                </div>

                <div id="participantes"></div>
            </fieldset>

            <fieldset id="aceptacion" style="display: none;">
                <legend>Aceptación de condiciones</legend>
                <div class="form-check mb-4">
                    <input type="checkbox" class="form-check-input" id="condiciones" name="condiciones" value="aceptado" required>
                    <label for="condiciones" class="form-check-label">Acepto las condiciones de inscripcion.</label>
                </div>
            </fieldset>
            <button type="submit" class="btn btn-primary">Aceptar</button>
            <button type="reset" class="btn btn-secondary">Cancelar</button>

        </form>
    </main>

    <footer>
        <p>Deportes Unca - 2026</p>
    </footer>
    <script src="../../Practico3/js/practico3parte1.js"></script>
    <script src="../../Practico3/js/practico3Ejercicio5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
